name: pages

on:
  workflow_dispatch:
  schedule:
    # runs after sync (17 3 2 * *) so Pages gets the refreshed data
    - cron: "47 4 2 * *"
  push:
    branches:
      - main
    paths:
      - "tools/playground-template.html"
      - "tools/build-playground.mjs"
      - "data/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build playground
        run: |
          node tools/build-playground.mjs
          mkdir -p _site
          cp playground.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
