name: sync
on:
  schedule:
    - cron: "17 3 2 * *" # monthly, 2nd of the month 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: run sync
        run: node tools/sync.mjs

      # refresh the README record-count badge
      - name: update count badge
        run: node tools/build-count-badge.mjs

      # audit trail: exact raw payloads served by NESA for this run, ~90 days
      - name: upload raw payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raw-payloads
          path: data/raw/
          retention-days: 90

      # commits only when data changed; a gate abort (exit 1) skips this step
      - name: commit refreshed data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/
          git diff --cached --quiet
          || git commit -m "sync: refresh data and badge"
          git push
