name: sync
on:
  schedule:
    - cron: "17 3 2 * *" # monthly, 2nd of the month 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: run sync
        run: node tools/sync.mjs

      # audit trail: exact raw payloads served by NESA for this run, ~90 days
      - name: upload raw payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-payloads
          path: data/raw/
          retention-days: 90

      # commits only when data changed; a gate abort (exit 1) skips this step
      - name: commit refreshed data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "sync: refresh data"
          git push
